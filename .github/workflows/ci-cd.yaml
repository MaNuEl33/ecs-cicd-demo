name: CI/CD a ECS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
      
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, repository, ref, environment}'
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::940603399822:role/github-ecs-ci-cd-demo-role
      
      - name: Login to ECR
        uses: docker/login-action@v4
        with:
          registry: 940603399822.dkr.ecr.us-east-1.amazonaws.com
      
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: 940603399822.dkr.ecr.us-east-1.amazonaws.com/hello-demo:v${{ github.run_number }}
      - name: Render Amazon ECS task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: app
          image: 940603399822.dkr.ecr.us-east-1.amazonaws.com/hello-demo:v${{ github.run_number }}
      - name: Deploy to Amazon ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ecs-hello-svc
          cluster: ecs-demo-cluster
          wait-for-service-stability: true